<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ember playground — proof of concept</title>

    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --panel: #ffffff;
        --border: #d9dbe0;
        --text: #1d2027;
        --muted: #6b7280;
        --accent: #e04e39;
        --error-bg: #fdecec;
        --error-border: #f0b5b5;
        --code-bg: #f2f3f5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      header .badge {
        font-size: 12px;
        color: var(--muted);
      }

      header .spacer {
        flex: 1;
      }

      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      #status {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
      }

      .pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      .pane + .pane {
        border-left: 1px solid var(--border);
      }

      .pane-title {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        min-height: 32px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .pane-title .spacer {
        flex: 1;
      }

      .tab {
        padding: 3px 10px;
        font-size: 12px;
        text-transform: none;
        letter-spacing: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
      }

      .tab.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      #editor {
        flex: 1;
        width: 100%;
        resize: none;
        border: 0;
        outline: none;
        padding: 12px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--panel);
        color: var(--text);
        tab-size: 2;
      }

      #output-wrap {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }

      #output {
        min-height: 100%;
      }

      #output h1,
      #output h2 {
        margin: 0 0 8px;
      }

      #output nav a {
        margin-right: 12px;
      }

      #output button {
        background: #eef0f4;
      }

      #output .panel {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        margin: 4px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      details {
        border-top: 1px solid var(--border);
        background: var(--panel);
      }

      details summary {
        cursor: pointer;
        padding: 6px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      pre {
        margin: 0;
        padding: 12px;
        overflow: auto;
        max-height: 300px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--code-bg);
        color: #24292f;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #error {
        display: none;
        margin: 12px 16px 0;
        padding: 10px 12px;
        border: 1px solid var(--error-border);
        border-radius: 6px;
        background: var(--error-bg);
        color: #8a1f1f;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        max-height: 220px;
        overflow: auto;
      }

      #error.visible {
        display: block;
      }

      #console {
        max-height: 150px;
        overflow: auto;
        padding: 8px 12px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #console .entry {
        display: flex;
        gap: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #console .tag {
        flex: none;
        width: 44px;
        color: var(--muted);
      }

      #console .error .tag,
      #console .error .text {
        color: #b91c1c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1d22;
          --panel: #23262d;
          --border: #363a43;
          --text: #e6e7ea;
          --muted: #9aa0ab;
          --error-bg: #3a2124;
          --error-border: #6b3438;
          --code-bg: #1b1d22;
        }
        pre {
          color: #d6d8dd;
        }
        #output button {
          background: #2d313a;
        }
        #console .error .tag,
        #console .error .text {
          color: #f87171;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Ember Playground</h1>
      <span class="badge">proof of concept — Glimmer components, compiled in your browser</span>
      <span class="spacer"></span>
      <span id="status">loading toolchain…</span>
      <button id="run" class="primary" disabled>Run</button>
    </header>

    <main>
      <section class="pane">
        <div class="pane-title">
          <span>App files</span>
          <span class="spacer"></span>
          <span id="tabs"></span>
        </div>
        <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
      </section>
      <section class="pane">
        <div class="pane-title">
          <span>Preview</span>
          <span class="spacer"></span>
          <button type="button" class="tab" id="tab-result">Result</button>
          <button type="button" class="tab" id="tab-compiled">Compiled output</button>
        </div>
        <div id="error"></div>
        <div id="output-wrap"><div id="output"></div></div>
        <pre id="inspector" hidden>—</pre>
        <details open>
          <summary>Console</summary>
          <div id="console"><div class="entry"><span class="tag">info</span><span class="text">no output</span></div></div>
        </details>
      </section>
    </main>

    <script type="module">
      /* =====================================================================
       * Ember, in one page, with no build step — the modern pipeline.
       * ---------------------------------------------------------------------
       * Every file in the editor is a real ES module with an Ember module
       * specifier, and it goes through the same three steps a build would run:
       *
       *   1. content-tag          `<template>` tags -> tagged `template()` calls
       *   2. @babel/standalone    + babel-plugin-ember-template-compilation,
       *                           which precompiles the HBS to Ember's wire
       *                           format and wraps it in `setComponentTemplate`
       *   3. a CommonJS eval      against ember's own AMD module registry
       *
       * The runtime is ember-source's `ember.prod.js` + `ember-template-compiler.js`
       * (see README: the modern ESM distribution cannot compile templates at
       * runtime, but the template compiler it publishes is exactly what the
       * Babel plugin wants as its `compiler` option).
       * ===================================================================== */

      const EMBER_VERSION = '5.12.0';
      const emberDistUrl = 'https://cdn.jsdelivr.net/npm/ember-source@' + EMBER_VERSION + '/dist';
      const babelUrl = 'https://unpkg.com/@babel/standalone@7.26.4/babel.js';
      const contentTagUrl = 'https://cdn.jsdelivr.net/npm/content-tag@4.2.0/pkg/standalone.js';
      const templatePluginUrl = 'https://esm.sh/babel-plugin-ember-template-compilation@4.0.0/browser';
      const glimmerComponentUrl = 'https://cdn.jsdelivr.net/npm/@glimmer/component@2.1.1/dist/index.js';

      const loadScript = (src) =>
        new Promise((resolve, reject) => {
          const el = document.createElement('script');
          el.src = src;
          el.onload = () => resolve(src);
          el.onerror = () => reject(new Error('Failed to load ' + src));
          document.head.append(el);
        });

      /* The AMD registry the runtime publishes. Everything under `@ember/*`,
       * `@glimmer/*` and `ember/*` is already in here. */
      const emberRequire = (specifier) => window.require(specifier);

      let Ember;
      let Babel;
      let Preprocessor;
      let templatePlugin;
      const externalModules = new Map();

      const transformToCommonJs = (source, filename, extraPlugins = []) => {
        const result = Babel.transform(source, {
          filename,
          configFile: false,
          babelrc: false,
          // Ember's `@tracked` / `@action` implement the *legacy* decorator
          // protocol (`(target, key, descriptor)`), so decorated fields have to
          // be assigned rather than defined — otherwise the initialiser a
          // decorator installed is clobbered by the field definition.
          assumptions: { setPublicClassFields: true },
          plugins: [templatePlugin, ...extraPlugins, 'transform-modules-commonjs'],
        });
        // The plugin passes the file name to the template compiler as
        // `filename`, which the wire format ignores; it reads `moduleName`
        // instead, which nothing sets for us. Fixing it up post-hoc is the
        // difference between "(unknown template module)" and the real path in
        // every template error message.
        return result.code.split('"(unknown template module)"').join(JSON.stringify(filename));
      };

      const runCommonJs = (code, require) => {
        const module = { exports: {} };
        new Function('require', 'module', 'exports', code + '\n//# sourceURL=' + 'module.js')(
          require,
          module,
          module.exports,
        );
        return module.exports;
      };

      const loadExternalModule = async (specifier, url) => {
        const source = await fetch(url).then((response) => {
          if (!response.ok) throw new Error('Failed to fetch ' + url);
          return response.text();
        });
        const exports = runCommonJs(transformToCommonJs(source, specifier), emberRequire);
        externalModules.set(specifier, exports);
      };

      const loadToolchain = async () => {
        // Order matters: the compiler registers itself with the runtime's AMD
        // loader, and neither publishes a `window.Ember` global.
        await loadScript(emberDistUrl + '/ember.prod.js');
        await loadScript(emberDistUrl + '/ember-template-compiler.js');
        await loadScript(babelUrl);

        Ember = emberRequire('ember').default;
        Babel = window.Babel;

        const [contentTag, plugin] = await Promise.all([
          import(/* @vite-ignore */ contentTagUrl),
          import(/* @vite-ignore */ templatePluginUrl),
        ]);
        Preprocessor = contentTag.Preprocessor;
        templatePlugin = plugin.default || plugin;

        // `@babel/standalone` has no `transformAsync`, but the plugin is an
        // async factory. Resolving it once — against Babel's own plugin API,
        // which is only reachable by letting Babel invoke a plugin — yields a
        // plain PluginObj that the synchronous `transform` accepts.
        let babelApi;
        Babel.transform('', {
          configFile: false,
          babelrc: false,
          plugins: [
            (api) => {
              babelApi = api;
              return { visitor: {} };
            },
          ],
        });
        templatePlugin = await templatePlugin(babelApi, {
          compiler: emberRequire('ember-template-compiler/minimal'),
        });

        await loadExternalModule('@glimmer/component', glimmerComponentUrl);
      };

      /* =====================================================================
       * The project — a small but ordinary Ember 5 app layout.
       * ===================================================================== */

      const STARTER_PROJECT = [
        {
          path: 'router.js',
          code: [
            "import EmberRouter from '@ember/routing/router';",
            '',
            'export default class Router extends EmberRouter {}',
            '',
            'Router.map(function () {',
            "  this.route('about');",
            '});',
            '',
          ].join('\n'),
        },
        {
          path: 'templates/application.hbs',
          code: [
            '<div class="app">',
            '  <h1>Ember, compiled in the browser</h1>',
            '',
            '  <nav>',
            '    <LinkTo @route="index">Home</LinkTo>',
            '    <LinkTo @route="about">About</LinkTo>',
            '  </nav>',
            '',
            '  <hr />',
            '',
            '  {{outlet}}',
            '</div>',
            '',
          ].join('\n'),
        },
        {
          path: 'templates/index.hbs',
          code: [
            '<h2>Home</h2>',
            '',
            '<p>Count is <strong>{{this.count}}</strong>.</p>',
            '',
            '<button type="button" {{on "click" this.increment}}>+1</button>',
            '<button type="button" {{on "click" this.reset}}>Reset</button>',
            '',
            '<p>Two Glimmer components, each with its own state:</p>',
            '',
            '<CounterPanel @start={{10}} />',
            '<CounterPanel @start={{100}} />',
            '',
          ].join('\n'),
        },
        {
          path: 'templates/about.hbs',
          code: [
            '<h2>About</h2>',
            '',
            '<p>',
            '  Every file on the left is compiled in this tab: content-tag rewrites',
            '  the &lt;template&gt; tags, Babel precompiles the templates to Ember\'s',
            '  wire format, and the result runs against ember-source.',
            '</p>',
            '',
          ].join('\n'),
        },
        {
          path: 'controllers/index.js',
          code: [
            "import Controller from '@ember/controller';",
            "import { tracked } from '@glimmer/tracking';",
            '',
            'export default class IndexController extends Controller {',
            '  @tracked count = 0;',
            '',
            '  increment = () => {',
            '    this.count++;',
            '  };',
            '',
            '  reset = () => {',
            '    this.count = 0;',
            '  };',
            '}',
            '',
          ].join('\n'),
        },
        {
          path: 'components/counter-panel.gjs',
          code: [
            "import Component from '@glimmer/component';",
            "import { tracked } from '@glimmer/tracking';",
            "import { on } from '@ember/modifier';",
            '',
            'export default class CounterPanel extends Component {',
            '  @tracked count = this.args.start ?? 0;',
            '',
            '  bump = () => {',
            '    this.count++;',
            '  };',
            '',
            '  <template>',
            '    <div class="panel">',
            '      <span>clicks: {{this.count}}</span>',
            '      <button type="button" {{on "click" this.bump}}>bump</button>',
            '    </div>',
            '  </template>',
            '}',
            '',
          ].join('\n'),
        },
      ];

      /* =====================================================================
       * Module graph
       * ===================================================================== */

      const userModules = new Map();
      const loading = new Set();
      const compiledSources = new Map();

      // Where each kind of file lives, and what it registers as.
      const registries = { component: {}, controller: {}, route: {} };

      const dirname = (path) => {
        const index = path.lastIndexOf('/');
        return index === -1 ? '' : path.slice(0, index);
      };

      const resolveRelative = (from, specifier) => {
        const segments = (dirname(from) + '/' + specifier).split('/');
        const parts = [];
        for (const segment of segments) {
          if (segment === '' || segment === '.') continue;
          if (segment === '..') parts.pop();
          else parts.push(segment);
        }
        const base = parts.join('/');
        const candidates = [base, base + '.js', base + '.gjs', base + '.hbs', base + '/index.js', base + '/index.gjs'];
        return candidates.find((candidate) => files.some((file) => file.path === candidate));
      };

      const isGlimmerTemplate = (source) => /<template[\s>]/.test(source);

      const compile = (path) => {
        const file = files.find((entry) => entry.path === path);
        if (!file) throw new Error('No such file: ' + path);

        let source = file.code;
        if (path.endsWith('.hbs')) {
          // A route template is a module too: `precompileTemplate` with no
          // backing class compiles to a bare template factory, which is
          // exactly what the router looks up.
          source = [
            "import { precompileTemplate } from '@ember/template-compilation';",
            'export default precompileTemplate(' + JSON.stringify(file.code) + ');',
          ].join('\n');
        } else if (isGlimmerTemplate(source)) {
          source = new Preprocessor().process(source, { filename: path }).code;
        }

        const code = transformToCommonJs(source, path, [
          ['proposal-decorators', { legacy: true }],
          // Required order: the decorators transform rewrites fields into
          // initialiser calls, and these have to run after it. The template
          // plugin emits `static { setComponentTemplate(...) }`, which the
          // legacy class-properties transform does not understand on its own.
          'transform-class-properties',
          'transform-class-static-block',
        ]);
        compiledSources.set(path, code);
        return code;
      };

      const moduleRequire = (from) => (specifier) => {
        if (specifier.startsWith('.')) {
          const path = resolveRelative(from, specifier);
          if (!path) throw new Error('Cannot resolve "' + specifier + '" from ' + from);
          return loadModule(path);
        }
        if (externalModules.has(specifier)) return externalModules.get(specifier);
        return emberRequire(specifier);
      };

      const loadModule = (path) => {
        const cached = userModules.get(path);
        if (cached) return cached;
        if (loading.has(path)) {
          throw new Error('Circular import involving ' + path);
        }
        loading.add(path);
        try {
          const exports = runCommonJs(compile(path), moduleRequire(path));
          userModules.set(path, exports);
          return exports;
        } finally {
          loading.delete(path);
        }
      };

      const registerModules = () => {
        const collect = (prefix, extensions) => {
          const found = {};
          for (const file of files) {
            if (!file.path.startsWith(prefix)) continue;
            if (!extensions.some((extension) => file.path.endsWith(extension))) continue;
            const name = file.path.slice(prefix.length).replace(/\.[^.]+$/, '');
            found[name] = loadModule(file.path).default;
          }
          return found;
        };

        registries.component = collect('components/', ['.gjs', '.js']);
        registries.controller = collect('controllers/', ['.js', '.gjs']);
        registries.route = collect('routes/', ['.js', '.gjs']);

        for (const name of Object.keys(Ember.TEMPLATES)) delete Ember.TEMPLATES[name];
        for (const [name, template] of Object.entries(collect('templates/', ['.hbs']))) {
          Ember.TEMPLATES[name] = template;
        }
      };

      /* =====================================================================
       * The one piece of glue a browser host has to supply.
       * ---------------------------------------------------------------------
       * Ember 5 removed `Ember.DefaultResolver` from ember-source (it lives in
       * the `ember-resolver` addon), but `Application#buildRegistry` still calls
       * `namespace.Resolver.create(...)` unconditionally, so `create()` throws
       * without one. Everything the app needs is keyed by name here or lives in
       * `Ember.TEMPLATES`, so the resolver is a handful of lines.
       * ===================================================================== */

      const makeResolver = () =>
        Ember.Object.extend({
          resolve(fullName) {
            const separator = fullName.indexOf(':');
            const type = fullName.slice(0, separator);
            const name = fullName.slice(separator + 1);
            // `template:*` is registered with `instantiate: false`, so the
            // registry wants the bare template factory back.
            if (type === 'template') return Ember.TEMPLATES[name];
            return registries[type] ? registries[type][name] : undefined;
          },
        });

      /* =====================================================================
       * UI
       * ===================================================================== */

      const editor = document.getElementById('editor');
      const tabsEl = document.getElementById('tabs');
      const output = document.getElementById('output');
      const inspector = document.getElementById('inspector');
      const errorEl = document.getElementById('error');
      const statusEl = document.getElementById('status');
      const consoleEl = document.getElementById('console');
      const runButton = document.getElementById('run');
      const tabButtons = {
        result: document.getElementById('tab-result'),
        compiled: document.getElementById('tab-compiled'),
      };

      const files = STARTER_PROJECT.map((file) => ({ ...file }));
      let activeFile = files[1];
      let activeView = 'result';
      let currentApp = null;

      const log = (type, text) => {
        if (consoleEl.querySelector('.entry .text')?.textContent === 'no output') {
          consoleEl.replaceChildren();
        }
        const entry = document.createElement('div');
        entry.className = 'entry ' + type;
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = type;
        const body = document.createElement('span');
        body.className = 'text';
        body.textContent = text;
        entry.append(tag, body);
        consoleEl.append(entry);
        consoleEl.scrollTop = consoleEl.scrollHeight;
      };

      const clearConsole = () => {
        consoleEl.replaceChildren();
        log('info', 'no output');
      };

      const setError = (message) => {
        if (!message) {
          errorEl.textContent = '';
          errorEl.classList.remove('visible');
          return;
        }
        errorEl.textContent = message;
        errorEl.classList.add('visible');
      };

      const refreshInspector = () => {
        if (activeView !== 'compiled') return;
        inspector.textContent =
          compiledSources.get(activeFile.path) ?? 'Nothing compiled yet — press Run.';
      };

      const setView = (view) => {
        activeView = view;
        for (const [name, button] of Object.entries(tabButtons)) {
          button.classList.toggle('active', name === view);
        }
        document.getElementById('output-wrap').hidden = view !== 'result';
        inspector.hidden = view === 'result';
        refreshInspector();
      };

      const renderTabs = () => {
        tabsEl.replaceChildren(
          ...files.map((file) => {
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'tab' + (file === activeFile ? ' active' : '');
            tab.textContent = file.path;
            tab.addEventListener('click', () => {
              activeFile = file;
              editor.value = file.code;
              renderTabs();
              refreshInspector();
              editor.focus();
            });
            return tab;
          }),
        );
      };

      editor.addEventListener('input', () => {
        activeFile.code = editor.value;
        refreshInspector();
      });

      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Tab' && !event.shiftKey) {
          event.preventDefault();
          const { selectionStart: start, selectionEnd: end } = editor;
          editor.setRangeText('  ', start, end, 'end');
          activeFile.code = editor.value;
        } else if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          run();
        }
      });

      for (const [name, button] of Object.entries(tabButtons)) {
        button.addEventListener('click', () => setView(name));
      }

      /* =====================================================================
       * Run
       * ===================================================================== */

      const teardown = () => {
        if (!currentApp) return;
        const app = currentApp;
        currentApp = null;
        try {
          Ember.run(() => app.destroy());
        } catch (error) {
          log('warn', 'teardown: ' + ((error && error.message) || error));
        }
        output.replaceChildren();
      };

      const run = async () => {
        runButton.disabled = true;
        setError('');
        clearConsole();
        const started = performance.now();

        try {
          // Compile everything first: a failure here leaves the last good
          // preview on screen. Route maps are read off `Ember.Router`'s own
          // `dslCallbacks` (see README), and they are per-run state.
          compiledSources.clear();
          userModules.clear();
          Ember.Router.dslCallbacks = null;
          registerModules();

          const router = files.find((file) => file.path === 'router.js');
          if (router) {
            const routeMap = loadModule('router.js').default?.dslCallbacks;
            if (routeMap) Ember.Router.dslCallbacks = routeMap;
          }

          teardown();

          // `Autoboot` builds the router inside `create()`, so the route map
          // above has to exist already.
          currentApp = Ember.Application.create({
            rootElement: '#output',
            // `hash` keeps the router navigable without rewriting the path of
            // whatever page hosts this (`history` would, and needs a server).
            location: 'hash',
            Resolver: makeResolver(),
          });

          const elapsed = Math.round(performance.now() - started);
          statusEl.textContent = 'ran in ' + elapsed + ' ms';
          log('info', 'compiled ' + userModules.size + ' module(s) with Ember ' + Ember.VERSION);
          log('info', 'templates: ' + Object.keys(Ember.TEMPLATES).join(', '));
          log('info', 'components: ' + (Object.keys(registries.component).join(', ') || 'none'));
        } catch (error) {
          const message = (error && error.message) || String(error);
          setError(message);
          statusEl.textContent = 'failed';
          log('error', message);
        } finally {
          runButton.disabled = false;
        }
      };

      runButton.addEventListener('click', run);

      editor.value = activeFile.code;
      renderTabs();
      setView('result');

      loadToolchain()
        .then(() => {
          statusEl.textContent = 'Ember ' + Ember.VERSION + ' ready';
          runButton.disabled = false;
          return run();
        })
        .catch((error) => {
          const message = (error && error.message) || String(error);
          setError(message);
          statusEl.textContent = 'failed to load toolchain';
          log('error', message);
        });
    </script>
  </body>
</html>
